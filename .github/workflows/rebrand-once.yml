name: Rebrand to Tropeamine Packs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebrand:
    if: github.event.head_commit.message == 'Run one-time Tropeamine Packs rebrand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/rebrand.mjs
      - run: |
          git config user.name "rabine707"
          git config user.email "krabinejr@gmail.com"
          git add -A
          git commit -m "Rebrand app to Tropeamine Packs"
          git push
