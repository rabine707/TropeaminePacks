name: Patch HaremLit pack art
on:
  push:
    branches: [add-second-pack-option]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-second-pack-option
      - name: Wire pack artwork into UI
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('components/collection-app.tsx')
          s = app.read_text()
          s = s.replace(
            "{id:'haremlit-1',name:'HaremLit 1',kicker:'HAREMLIT · PACK 01',subtitle:'WARLOCK + COVEN KING',description:'The first Tropeamine release. Pull from the Warlock and Coven King sets while each card keeps its original series identity.',series:['Warlock','Coven King']},",
            "{id:'haremlit-1',name:'HaremLit 1',kicker:'HAREMLIT · PACK 01',subtitle:'WARLOCK + COVEN KING + DUNGEON DIVING 101',description:'The first Tropeamine release. Pull from Warlock, Coven King, and Dungeon Diving 101 while each card keeps its original series identity.',series:['Warlock','Coven King','Dungeon Diving 101'],image:'/packs/haremlit-1-pack.webp',imageAlt:'HaremLit 1 booster pack artwork'},"
          )
          s = s.replace(
            "{id:'dark-romance-1',name:'Dark Romance 1',kicker:'DARK ROMANCE · PACK 01',subtitle:'LIGHTS OUT + CAUGHT UP + GAME ON',description:'The second Tropeamine release. Pull from the Lights Out series now, with the Ruinous Love trilogy joining the collection next.',series:['Lights Out','Caught Up','Game On']}",
            "{id:'dark-romance-1',name:'Dark Romance 1',kicker:'DARK ROMANCE · PACK 01',subtitle:'LIGHTS OUT + CAUGHT UP + GAME ON',description:'The second Tropeamine release. Pull from the Lights Out series now, with the Ruinous Love trilogy joining the collection next.',series:['Lights Out','Caught Up','Game On'],image:null,imageAlt:'Dark Romance 1 booster pack artwork'}"
          )
          old = '<div className="pack-display"><div className="pack-object"><span>TROPEAMINE PACKS</span><div className="pack-line"/><Sparkles size={46} strokeWidth={.8}/><h2>{selectedPack.name}</h2><p>{selectedPack.subtitle}</p><div className="pack-line"/><small>5 CARDS · SERIES-LOCKED</small></div><span className="pack-shadow"/></div>'
          new = '<div className="pack-display">{selectedPack.image?<Image src={selectedPack.image} alt={selectedPack.imageAlt} width={290} height={363} className="pack-art" priority/>:<><div className="pack-object"><span>TROPEAMINE PACKS</span><div className="pack-line"/><Sparkles size={46} strokeWidth={.8}/><h2>{selectedPack.name}</h2><p>{selectedPack.subtitle}</p><div className="pack-line"/><small>5 CARDS · PACK-SELECTED</small></div><span className="pack-shadow"/></>}</div>'
          if old not in s:
            raise SystemExit('pack display anchor not found')
          s = s.replace(old, new)
          app.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          anchor = '.pack-display{display:flex;min-height:470px;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse,#66704422,transparent 70%)}'
          addition = anchor + '.pack-art{width:min(100%,290px);height:auto;object-fit:contain;filter:drop-shadow(10px 20px 28px #0009);transform:rotate(-2deg);transition:transform .2s ease,filter .2s ease}.pack-art:hover{transform:rotate(-1deg) translateY(-3px) scale(1.01);filter:drop-shadow(12px 24px 32px #000b)}'
          if anchor not in c:
            raise SystemExit('pack display css anchor not found')
          c = c.replace(anchor, addition, 1)
          css.write_text(c)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/patch-pack-art.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/collection-app.tsx app/globals.css .github/workflows/patch-pack-art.yml
          git commit -m "Use HaremLit 1 artwork on packs page"
          git push origin HEAD:add-second-pack-option
