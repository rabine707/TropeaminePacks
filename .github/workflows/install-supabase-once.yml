name: Install Supabase dependencies once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-supabase-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install @supabase/supabase-js @supabase/ssr
      - run: |
          git config user.name "rabine707"
          git config user.email "krabinejr@gmail.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already installed"
          else
            git commit -m "Add Supabase auth dependencies"
            git push
          fi
