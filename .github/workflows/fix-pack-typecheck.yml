name: Fix pack typecheck
on:
  push:
    branches: [add-second-pack-option]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-second-pack-option
      - name: Remove impossible pack fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/collection-app.tsx')
          s=p.read_text()
          old='<div className="pack-display">{selectedPack.image?<Image src={selectedPack.image} alt={selectedPack.imageAlt} width={290} height={363} className="pack-art" priority/>:<><div className="pack-object"><span>TROPEAMINE PACKS</span><div className="pack-line"/><Sparkles size={46} strokeWidth={.8}/><h2>{selectedPack.name}</h2><p>{selectedPack.subtitle}</p><div className="pack-line"/><small>5 CARDS · PACK-SELECTED</small></div><span className="pack-shadow"/></>}</div>'
          new='<div className="pack-display"><Image src={selectedPack.image} alt={selectedPack.imageAlt} width={290} height={363} className="pack-art" priority/></div>'
          if old not in s:
              raise SystemExit('pack fallback anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify typecheck and build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-pack-typecheck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/collection-app.tsx .github/workflows/fix-pack-typecheck.yml
          git commit -m "Fix pack artwork typecheck"
          git push origin HEAD:add-second-pack-option
