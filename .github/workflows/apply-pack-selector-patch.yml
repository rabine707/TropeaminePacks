name: Apply pack selector patch

on:
  push:
    branches:
      - add-second-pack-option

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-second-pack-option
      - name: Patch pack selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/collection-app.tsx')
          text = path.read_text()

          marker = "const treatments:{id:Treatment;label:string;cost:number}[]=[{id:'base',label:'Base',cost:0},{id:'holo',label:'Holo',cost:3},{id:'heartthrob',label:'Heartthrob',cost:5},{id:'unhinged',label:'Unhinged',cost:10},{id:'slowburn',label:'Slow Burn',cost:10},{id:'aftercare',label:'Aftercare',cost:10}];\n"
          packs = """const packDefinitions=[\n {id:'haremlit-1',name:'HaremLit 1',kicker:'HAREMLIT · PACK 01',subtitle:'WARLOCK + COVEN KING',description:'The first Tropeamine release. Pull from the Warlock and Coven King sets while each card keeps its original series identity.',series:['Warlock','Coven King']},\n {id:'booktok-after-dark-1',name:'BookTok After Dark 1',kicker:'BOOKTOK · PACK 01',subtitle:'LIGHTS OUT + CAUGHT UP + GAME ON',description:'The second Tropeamine pack, built around the BookTok side of the shelf. Pull from Lights Out, Caught Up, and Game On as those cards go live.',series:['Lights Out','Caught Up','Game On']}\n] as const;\n"""
          if packs not in text:
              if marker not in text:
                  raise SystemExit('treatments marker not found')
              text = text.replace(marker, marker + packs, 1)

          old_state = "[packSeries,setPackSeries]=useState<string|null>(null)"
          new_state = "[packSeries,setPackSeries]=useState<string|null>('haremlit-1')"
          if old_state in text:
              text = text.replace(old_state, new_state, 1)

          totals_marker = "const sfw=state.cards.filter(c=>!c.adult);const activeSeries=sfw.find(c=>normalize(c.series)===normalize(decodeURIComponent(path.split('/')[2]||'warlock')))?.series||'Warlock';const setCards=sfw.filter(c=>c.series===activeSeries);const setOwned=setCards.filter(c=>state.wallet.owned.includes(c.id)).length;const owned=sfw.filter(c=>state.wallet.owned.includes(c.id));const count=owned.length;const foilCount=sfw.filter(c=>state.wallet.owned.includes(`${c.id}:foil`)).length;const editionCount=count+foilCount;const totalEditions=sfw.length*2;\n"
          pack_state = " const selectedPack=packDefinitions.find(p=>p.id===packSeries)??packDefinitions[0];const packPool=sfw.filter(c=>c.available&&selectedPack.series.some(s=>normalize(s)===normalize(c.series)));\n"
          if pack_state not in text:
              if totals_marker not in text:
                  raise SystemExit('totals marker not found')
              text = text.replace(totals_marker, totals_marker + pack_state, 1)

          old_pack_fn = "async function pack(){try{if(!signedIn||!onSpendInk)throw new Error('Sign in to open packs and keep your cards.');const pool=stateRef.current.cards.filter(c=>c.available&&!c.adult);if(!pool.length)throw new Error('No cards are available in the pack yet.');const walletForRoll={...stateRef.current.wallet,ink:Math.max(stateRef.current.wallet.ink,100)};const r=openPack(walletForRoll,pool);const cloud=await onSpendInk(100);update(s=>({...s,wallet:{...r.wallet,ink:cloud.ink,shards:cloud.shards+r.pulls.filter(p=>p.duplicate).length*10},opened:s.opened+1}));setPulls(r.pulls);setRevealed(0)}catch(e){setToast(e instanceof Error?e.message:'Could not open pack')}}"
          new_pack_fn = "async function pack(){try{if(!signedIn||!onSpendInk)throw new Error('Sign in to open packs and keep your cards.');const currentPack=packDefinitions.find(p=>p.id===packSeries)??packDefinitions[0];const pool=stateRef.current.cards.filter(c=>c.available&&!c.adult&&currentPack.series.some(s=>normalize(s)===normalize(c.series)));if(pool.length<4)throw new Error(`${currentPack.name} needs at least 4 available cards before it can be opened.`);const walletForRoll={...stateRef.current.wallet,ink:Math.max(stateRef.current.wallet.ink,100)};const r=openPack(walletForRoll,pool);const cloud=await onSpendInk(100);update(s=>({...s,wallet:{...r.wallet,ink:cloud.ink,shards:cloud.shards+r.pulls.filter(p=>p.duplicate).length*10},opened:s.opened+1}));setPulls(r.pulls);setRevealed(0)}catch(e){setToast(e instanceof Error?e.message:'Could not open pack')}}"
          if old_pack_fn in text:
              text = text.replace(old_pack_fn, new_pack_fn, 1)
          elif new_pack_fn not in text:
              raise SystemExit('pack function marker not found')

          start = text.find(" {page==='packs'&&")
          end = text.find(" {page==='quests'&&", start)
          if start < 0 or end < 0:
              raise SystemExit('packs render block not found')
          new_block = """ {page==='packs'&&<><div className=\"page-heading\"><div><p className=\"eyebrow\">CHOOSE YOUR NEXT PACK</p><h1>Tropeamine Packs</h1><p>Each release has its own card pool. Pick the shelf you want to pull from.</p></div><span className=\"pill\"><Droplets size={14}/>{signedIn?(cloudWallet?.ink??state.wallet.ink):'—'} Ink available</span></div><div className=\"tabs\">{packDefinitions.map(p=><button key={p.id} className={selectedPack.id===p.id?'selected':''} onClick={()=>setPackSeries(p.id)}>{p.name}</button>)}</div><div className=\"pack-layout\"><div className=\"pack-display\"><div className=\"pack-object\"><span>TROPEAMINE PACKS</span><div className=\"pack-line\"/><Sparkles size={46} strokeWidth={.8}/><h2>{selectedPack.name}</h2><p>{selectedPack.subtitle}</p><div className=\"pack-line\"/><small>5 CARDS · SERIES-LOCKED</small></div><span className=\"pack-shadow\"/></div><div className=\"pack-copy\"><span className=\"pill\">{selectedPack.kicker}</span><h2>{selectedPack.name}</h2><p>{selectedPack.description}</p><div className=\"pack-catalog-meta\"><span>{packPool.length} cards in pool</span><span>{selectedPack.series.filter(s=>sfw.some(c=>c.available&&normalize(c.series)===normalize(s))).length}/{selectedPack.series.length} sets live</span><span>100 Ink</span></div><div className=\"tags\">{selectedPack.series.map(s=><span key={s}>{s}</span>)}</div><ul className=\"benefits\"><li><CheckCircle2 size={18}/>5 cards in every pack</li><li><CheckCircle2 size={18}/>4 unique base pulls + 1 guaranteed foil</li><li><Diamond size={18}/>Duplicates become 10 Shards each</li><li><Sparkles size={18}/>Only cards from this pack's listed sets can appear</li></ul>{signedIn?<><button className=\"button gold large\" disabled={!ready||(cloudWallet?.ink??state.wallet.ink)<100||packPool.length<4} onClick={pack}>Open {selectedPack.name} <span>100 Ink <Droplets size={16}/></span></button>{packPool.length<4&&<p className=\"footnote\">This pack will unlock automatically once at least 4 cards from its sets are published and available.</p>}<Link href=\"/quests\" className=\"text-link\">Need more Ink? Visit your quests <ArrowRight size={15}/></Link></>:<div className=\"panel\"><strong>Sign in to open packs</strong><p>Your pulls, Ink, Shards, and binder are tied to your account so they stay with you across devices.</p><Link href=\"/login?next=/packs\" className=\"button gold\">Sign in with Google <ArrowRight size={15}/></Link></div>}<details className=\"odds\"><summary>What's inside? View pack odds</summary><p>Every pack contains 5 cards: slots 1–4 are four different base cards from the selected pack's sets, and slot 5 is always a guaranteed foil. The foil may match one of the first four cards. Base and foil editions are tracked separately in your binder. Pulling an edition you already own converts that duplicate into 10 Shards. No cash value or trading.</p></details></div></div></>}\n"""
          text = text[:start] + new_block + text[end:]

          path.write_text(text)

          workflow = Path('.github/workflows/apply-pack-selector-patch.yml')
          if workflow.exists():
              workflow.unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/collection-app.tsx .github/workflows/apply-pack-selector-patch.yml
          git commit -m "feat: add selectable pack releases"
          git push origin HEAD:add-second-pack-option
